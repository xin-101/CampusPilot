spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campuspilot}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

logging:
  level:
    com.campuspilot: DEBUG
    org.springframework.security: WARN

agent:
  provider: ${AGENT_PROVIDER:mock}
  rag:
    provider: ${AGENT_RAG_PROVIDER:vector}
    knowledgeDir: ${KNOWLEDGE_DIR:../knowledge}