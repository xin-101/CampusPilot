version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: campuspilot-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campuspilot
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - campuspilot-network
    restart: unless-stopped

  backend:
    build:
      context: ./campuspilot
      dockerfile: Dockerfile
    container_name: campuspilot-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=campuspilot
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=${JWT_SECRET:-campuspilot-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
      - AGENT_PROVIDER=${AGENT_PROVIDER:-mock}
      - AGENT_RAG_PROVIDER=${AGENT_RAG_PROVIDER:-vector}
      - KNOWLEDGE_DIR=${KNOWLEDGE_DIR:-/app/knowledge}
      - TZ=Asia/Shanghai
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-30000}
      - LLM_FALLBACK_TO_MOCK=${LLM_FALLBACK_TO_MOCK:-false}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./knowledge:/app/knowledge:ro
    networks:
      - campuspilot-network
    restart: unless-stopped

  frontend:
    build:
      context: ./campuspilot-web
      dockerfile: Dockerfile
    container_name: campuspilot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campuspilot-network
    restart: unless-stopped

networks:
  campuspilot-network:
    driver: bridge

volumes:
  mysql-data: